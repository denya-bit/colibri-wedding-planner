body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:80px;-webkit-font-smoothing:antialiased;transition:all .3s}
.header{background:linear-gradient(135deg,var(--header1),var(--header2),var(--header3));color:var(--accent);padding:16px;display:flex;justify-content:flex-start;align-items:center;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 4px 24px rgba(0,0,0,0.2)}
.header-title{font-size:20px;font-weight:700;letter-spacing:-0.3px}
.theme-btn{background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.2);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--accent);min-width:40px;text-align:center;width:auto}
.theme-btn:active{transform:scale(0.9)}
.theme-picker{position:fixed;top:60px;right:12px;left:12px;background:var(--card);border:2px solid var(--border);border-radius:16px;padding:12px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,0.3);display:none}
.theme-picker.show{display:block}
.theme-option{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:background .2s;margin-bottom:6px}
.theme-option:hover{background:var(--card2)}
.theme-option.active{background:var(--card2);border:2px solid var(--accent)}
.theme-preview{width:36px;height:36px;border-radius:10px;border:2px solid var(--border)}
.theme-name{font-size:14px;font-weight:600;color:var(--text)}
.content{padding:12px;max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 16px rgba(0,0,0,0.15);border:1px solid var(--border);transition:transform .2s}
.card h3{margin-bottom:12px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--accent)}
.form-label{font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}
input,textarea,select{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:15px;margin-bottom:10px;background:var(--card2);color:var(--text);transition:all .2s;outline:none}
input:focus,select:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px rgba(0,229,255,0.12)}
input::placeholder{color:var(--text2)}
button{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:var(--accent-text);border:none;padding:13px 20px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;width:100%;transition:all .2s;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
button:active{transform:scale(0.97)}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;border-top:1px solid var(--border);z-index:100;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;text-align:center;padding:6px 2px;cursor:pointer;transition:all .2s;border-radius:12px;margin:0 2px;-webkit-tap-highlight-color:transparent}
.tab:active{transform:scale(0.9)}
.tab.active{background:var(--accent)}
.tab .icon{font-size:20px;line-height:1}
.tab .label{font-size:9px;margin-top:3px;font-weight:600;letter-spacing:0.2px;color:var(--text2)}
.tab.active .label{color:var(--accent-text)}
.stat-box{background:linear-gradient(135deg,var(--card2),var(--card));padding:14px 10px;border-radius:14px;text-align:center;border:1px solid var(--border)}
.stat-box .num{font-size:22px;font-weight:800;line-height:1.2;color:var(--accent)}
.stat-box .lbl{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.progress-bar{background:var(--border);border-radius:10px;height:10px;overflow:hidden}
.progress-fill{height:100%;border-radius:10px;transition:width .4s ease;background:linear-gradient(90deg,var(--accent),var(--accent-dark))}
.filter-btn{flex:1;padding:8px 4px;font-size:11px;font-weight:600;border:none;border-radius:10px;cursor:pointer;transition:all .2s;background:var(--card2);color:var(--text2)}
.filter-btn:active{transform:scale(0.95)}
.filter-btn.active{background:var(--accent);color:var(--accent-text)}
.list-item{padding:12px 0;border-bottom:1px solid var(--border);transition:background .2s}
.list-item:last-child{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
.hero-card{background:linear-gradient(135deg,var(--header1),var(--header2),var(--header3));color:var(--accent);padding:24px 20px;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,0.2);position:relative;overflow:hidden}
.hero-card::before{content:'';position:absolute;top:-50%;right:-20%;width:200px;height:200px;background:rgba(255,255,255,0.06);border-radius:50%}
.hero-card::after{content:'';position:absolute;bottom:-30%;left:-10%;width:150px;height:150px;background:rgba(255,255,255,0.04);border-radius:50%}
.notif-card{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative;overflow:hidden;border-left:4px solid var(--accent)}

// VK Bridge - correct Android API
(function(){
  var h={},id=0;
  function send(e,d){return new Promise(function(r,j){
    var i=++id;
    h[i]={r:r,j:j};
    var params=JSON.stringify(d||{});
    
    // Android: call named method directly
    if(window.AndroidBridge&&window.AndroidBridge[e]){
      window.AndroidBridge[e](params);
    }
    // iOS webkit
    else if(window.webkit&&window.webkit.messageHandlers){
      var k=Object.keys(window.webkit.messageHandlers);
      for(var n=0;n<k.length;n++)
        window.webkit.messageHandlers[k[n]].postMessage(JSON.stringify({type:e,data:d||{},id:i}));
    }
    // iframe
    else if(window.parent&&window.parent!==window){
      window.parent.postMessage(JSON.stringify({type:e,data:d||{},id:i}),"*");
    }
    
    setTimeout(function(){if(h[i]){h[i].r({result:true});delete h[i];}},3000);
  });}
  
  // Android bridge sends events via document events
  document.addEventListener("VKWebAppEvent",function(e){
    var d=e.detail;
    if(d&&d.data&&d.data.request_id&&h[d.data.request_id]){
      h[d.data.request_id].r(d.data);
      delete h[d.data.request_id];
    }
  });
  
  // Also listen for message events (iframe/ios)
  window.addEventListener("message",function(e){
    try{
      var d=typeof e.data==="string"?JSON.parse(e.data):e.data;
      if(d&&d.id&&h[d.id]){h[d.id].r(d.data||d);delete h[d.id];}
    }catch(x){}
  });
  
  window.vkBridge={send:send};
  send("VKWebAppInit");
})();

// STORAGE: VK Bridge primary, localStorage fallback
var _vks = {};       // VK Storage cache
var _vkReady = false; // VK Storage loaded
var _vkAvailable = false;

// Инициализация VK Storage
// ===== PARTNER SYNC =====
var API_BASE = "https://app.nevessta.ru/api";
var _syncCode = load("couple_code") || null;
var _syncUserId = load("sync_user_id") || null;
var _syncTimer = null;

// Получение user_id из VK
function _getVKUserId() {
  // 1. vk_user_id из URL (VK Mini App передаёт автоматически)
  try {
    var params = new URLSearchParams(window.location.search);
    var vkId = params.get("vk_user_id");
    if (vkId && vkId !== "0") return Promise.resolve(parseInt(vkId));
  } catch(e) {}
  // 2. Из VK Bridge
  if (window.vkBridge) {
    return vkBridge.send("VKWebAppGetUserInfo").then(function(r) {
      return r.id || 0;
    }).catch(function() { return 0; });
  }
  // 3. Браузер без VK — постоянный device ID
  var devId = localStorage.getItem("colibri_device_id");
  if (!devId) {
    devId = "dev_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9);
    localStorage.setItem("colibri_device_id", devId);
  }
  return Promise.resolve(devId);
}

// Создать пару
function createCouple() {
  _getVKUserId().then(function(uid) {
    var data = _getAllData();
    fetch(API_BASE + "/couple", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id: uid, name: load("wedding")?.bride || load("wedding")?.groom || "User", role: document.getElementById("my_role")?.value || "bride", data: data})
    }).then(function(r) { return r.json(); }).then(function(res) {
      if (res.code) {
        _syncCode = res.code;
        _syncUserId = uid;
        save("couple_code", _syncCode);
        save("sync_user_id", uid);
        _startSync();
        render();
      }
    }).catch(function(e) { console.log("Create couple error:", e); });
  });
}

// Присоединиться к паре
function joinCouple() {
  var input = document.getElementById("couple_code_input");
  if (!input || !input.value.trim()) return;
  var code = input.value.trim().toUpperCase();
  _getVKUserId().then(function(uid) {
    fetch(API_BASE + "/couple/" + code + "/join", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id: uid, name: load("wedding")?.bride || load("wedding")?.groom || "User", role: document.getElementById("join_role")?.value || "guest"})
    }).then(function(r) { return r.json(); }).then(function(res) {
      if (res.members) save("sync_members", res.members);
      if (res.members) save("sync_members", res.members);
      if (res.data) {
        _syncCode = code;
        _syncUserId = uid;
        save("couple_code", code);
        save("sync_user_id", uid);
        _loadFromServer(res.data);
        _startSync();
        render();
      }
    }).catch(function(e) { console.log("Join couple error:", e); });
  });
}

// Получить все данные
function _getAllData() {
  return {
    _ts: Date.now(),
    _uid: _syncUserId,
    wedding: load("wedding"),
    guests: load("guests"),
    budget: load("budget"),
    tasks: load("tasks"),
    vendors: load("vendors"),
    tables: load("tables")
  };
}

// Загрузить данные с сервера
function _loadFromServer(data) {
  // Сервер = источник правды. НЕ перезаписываем непустые локальные данные пустыми с сервера.
  function shouldLoad(serverVal, localVal) {
    if (serverVal === null || serverVal === undefined) return false;
    // Пустой массив/объект не перезаписывает непустые локальные данные
    var serverEmpty = (Array.isArray(serverVal) && serverVal.length === 0) || (typeof serverVal === "object" && !Array.isArray(serverVal) && Object.keys(serverVal).length === 0);
    var localHasData = localVal !== null && localVal !== undefined && !(Array.isArray(localVal) && localVal.length === 0);
    if (serverEmpty && localHasData) return false;
    return true;
  }
  var keys = ["wedding", "guests", "budget", "tasks", "vendors", "tables"];
  keys.forEach(function(k) {
    if (shouldLoad(data[k], load(k))) save(k, data[k]);
  });
}

// Сохранить на сервер
function _pushToServer() {
  if (!_syncCode) return;
  var data = _getAllData();
  // ЗАЩИТА: не отправляем пустые данные (перезаписали бы сервер)
  if (!data.wedding && (!data.guests || data.guests.length === 0)) return;
  fetch(API_BASE + "/couple/" + _syncCode, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({user_id: _syncUserId, data: data})
  }).catch(function(e) { console.log("Push error:", e); });
}

// Получить с сервера
function _pullFromServer(cb) {
  if (!_syncCode) { if (cb) cb(); return; }
  fetch(API_BASE + "/couple/" + _syncCode + "?user_id=" + _syncUserId)
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (res.members) save("sync_members", res.members);
      if (res.members) save("sync_members", res.members);
      if (res.data) {
        _loadFromServer(res.data);
        if (cb) cb();
      }
    })
    .catch(function(e) { console.log("Pull error:", e); if (cb) cb(); });
}

// Запуск синхронизации
function _startSync() {
  if (_syncTimer) clearInterval(_syncTimer);
  _syncTimer = setInterval(function() {
    _pullFromServer(function() {
      render();
    });
    _pushToServer();
  }, 30000);
}

// Отключить синхронизацию
function disconnectCouple() {
  _syncCode = null;
  _syncUserId = null;
  save("couple_code", null);
  save("sync_user_id", null);
  if (_syncTimer) clearInterval(_syncTimer);
  render();
}

// CHUNKED VK STORAGE SAVE — VKWebAppStorageSet лимит ~2236 байт (issue #226)
// Большие данные режем на части: colibri_X_0, colibri_X_1, ...
var _VK_CHUNK = 2000; // безопасный размер чанка (байт)

function _vksSaveChunked(k, json) {
  if (!window.vkBridge) return;
  if (json.length <= _VK_CHUNK) {
    // Маленькие данные — обычный ключ, удаляем чанки
    vkBridge.send("VKWebAppStorageSet", {key: k, value: json}).catch(function(){});
    for (var i = 0; i < 30; i++) {
      (function(idx){ setTimeout(function(){ vkBridge.send("VKWebAppStorageSet", {key: k + "_" + idx, value: ""}).catch(function(){}); }, 500); })(i);
    }
  } else {
    // Большие — чанкуем СНАЧАЛА пишем данные, ПОТОМ чистим лишнее
    var parts = Math.ceil(json.length / _VK_CHUNK);
    vkBridge.send("VKWebAppStorageSet", {key: k, value: "CHUNKED:" + parts}).catch(function(){});
    for (var i = 0; i < parts; i++) {
      vkBridge.send("VKWebAppStorageSet", {key: k + "_" + i, value: json.substring(i * _VK_CHUNK, (i + 1) * _VK_CHUNK)}).catch(function(){});
    }
    // Чистим ТОЛЬКО лишние старые чанки (позже частей)
    for (var i = parts; i < 30; i++) {
      (function(idx){ setTimeout(function(){ vkBridge.send("VKWebAppStorageSet", {key: k + "_" + idx, value: ""}).catch(function(){}); }, 500); })(i);
    }
  }
}

var _pendingPush = false;
function save(key, val) {
  var k = "colibri_" + key;
  var json = JSON.stringify(val);
  if (typeof _vks !== "undefined") { _vks[k] = val; }
  try { localStorage.setItem(k, json); } catch(e) {}
  if (typeof _vkAvailable !== "undefined" && _vkAvailable && typeof _vkReady !== "undefined" && _vkReady && window.vkBridge) {
    _vksSaveChunked(k, json);
  }
  // ВСЕГДА отправляем на сервер напрямую (без _syncCode!)
  _directSave(key, val);
  if (typeof _syncCode !== "undefined" && _syncCode) {
    _pushToServer();
  } else {
    _pendingPush = true;
  }
}

// ПРЯМОЕ сохранение на сервер — без couple_code, без условий
function _directSave(key, val) {
  var uid = (typeof _syncUserId !== "undefined" && _syncUserId !== null) ? _syncUserId : 0;
  // Если uid ещё не определился — читаем из URL
  if (uid === 0 || uid === null) {
    try {
      var p = new URLSearchParams(window.location.search);
      var vid = p.get("vk_user_id");
      if (vid && vid !== "0") { uid = parseInt(vid); _syncUserId = uid; }
    } catch(e) {}
  }
  var _payload = _getAllData();
  // ЗАЩИТА: не отправляем пустые данные
  if (!_payload.wedding && (!_payload.guests || _payload.guests.length === 0)) return;
  fetch(API_BASE + "/user-data", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({user_id: uid, payload: _payload})
  }).then(function(r) {
    if (r.ok) { console.log("Direct save OK"); }
    else { console.log("Direct save FAIL:", r.status); }
  }).catch(function(e) {
    console.log("Direct save ERROR:", e.message);
  });
}

function _initStorage(cb) {
  if (!window.vkBridge) {
    _vkAvailable = false;
    _vkReady = true;
    _migrateToVK();
    if (cb) cb();
    return;
  }
  _vkAvailable = true;
  vkBridge.send("VKWebAppStorageGetKeys", {count: 100, offset: 0}).then(function(r) {
    var keys = r.keys || [];
    if (keys.length === 0) {
      _vkReady = true;
      _migrateToVK();
      if (cb) cb();
      return;
    }
    var promises = keys.map(function(k) {
      return vkBridge.send("VKWebAppStorageGet", {key: k}).then(function(res) {
        return {key: k, value: res.value};
      });
    });
    return Promise.all(promises);
  }).then(function(items) {
    if (items) {
      items.forEach(function(item) {
        try { _vks[item.key] = JSON.parse(item.value); } catch(e) { _vks[item.key] = item.value; }
      });
    }
    // СОБИРАЕМ ЧАНКИ: colibri_X_0 + colibri_X_1 -> colibri_X
    Object.keys(_vks).forEach(function(k) {
      if (k.match(/_\d+$/) && _vks[k + "_0"] !== undefined) {
        // Это первый чанк — собираем
        return;
      }
    });
    // Ищем все базовые ключи с чанками
    var chunkBases = {};
    Object.keys(_vks).forEach(function(k) {
      var m = k.match(/^(.+?)_(\d+)$/);
      if (m && _vks[k] !== undefined && String(_vks[k]).length > 0 && String(_vks[k]).indexOf("CHUNKED:") !== 0) {
        var base = m[1];
        if (!chunkBases[base]) chunkBases[base] = [];
        chunkBases[base].push({idx: parseInt(m[2]), val: _vks[k]});
      }
    });
    Object.keys(chunkBases).forEach(function(base) {
      if (chunkBases[base].length === 0) return;
      // Собираем ТОЛЬКО если базовый ключ имеет маркер CHUNKED (не трогаем обычные данные)
      if (_vks[base] !== undefined && String(_vks[base]).indexOf("CHUNKED:") === 0) {
        chunkBases[base].sort(function(a, b) { return a.idx - b.idx; });
        var joined = chunkBases[base].map(function(c) { return c.val; }).join("");
        try { _vks[base] = JSON.parse(joined); } catch(e) { _vks[base] = joined; }
      }
    });
    _vkReady = true;
    _migrateToVK();
    if (cb) cb();
  }).catch(function(e) {
    console.log("VK Storage error:", e);
    _vkReady = true;
    if (cb) cb();
  });
}

// Миграция localStorage -> VK Storage (при первом запуске)
function _migrateToVK() {
  if (!_vkAvailable || !_vkReady) return;
  var migrated = false;
  var prefixes = ["colibri_wedding", "colibri_guests", "colibri_budget", "colibri_tasks", "colibri_vendors", "colibri_tables", "colibri_lang", "colibri_theme"];
  prefixes.forEach(function(k) {
    var lsVal = localStorage.getItem(k);
    if (lsVal && _vks[k] === undefined) {
      try {
        var parsed = JSON.parse(lsVal);
        _vks[k] = parsed;
        vkBridge.send("VKWebAppStorageSet", {key: k, value: lsVal}).catch(function(){});
        migrated = true;
      } catch(e) {
        _vks[k] = lsVal;
        vkBridge.send("VKWebAppStorageSet", {key: k, value: JSON.stringify(lsVal)}).catch(function(){});
        migrated = true;
      }
    }
  });
  if (migrated) console.log("Data migrated to VK Storage");
}

// LOAD: VK Storage -> localStorage fallback
function load(key) {
  var k = "colibri_" + key;
  // VK Storage (приоритет) — проверяем чанки
  if (_vkReady && _vkAvailable) {
    if (_vks[k] !== undefined) {
      // Если значение — маркер чанков, собираем
      if (_vks[k] === "CHUNKED:" + Object.keys(_vks).filter(function(x){return x.indexOf(k+"_")===0}).length) {
        // Собираем из чанков
        var parts = [];
        for (var i = 0; i < 50; i++) {
          if (_vks[k + "_" + i] !== undefined) parts.push(_vks[k + "_" + i]);
          else break;
        }
        if (parts.length > 0) {
          try { return JSON.parse(parts.join("")); } catch(e) {}
        }
      }
      if (_vks[k] !== null && _vks[k] !== undefined && String(_vks[k]).indexOf("CHUNKED:") !== 0) {
        return _vks[k];
      }
    }
    // Собираем чанки по маркеру или по наличию
    if (_vks[k + "_0"] !== undefined) {
      var parts = [];
      for (var i = 0; i < 50; i++) {
        if (_vks[k + "_" + i] !== undefined && String(_vks[k + "_" + i]).length > 0) parts.push(_vks[k + "_" + i]);
        else break;
      }
      if (parts.length > 0) {
        try { return JSON.parse(parts.join("")); } catch(e) {}
      }
    }
  }
  // localStorage fallback
  try { return JSON.parse(localStorage.getItem(k)) || null; } catch(e) { return null; }
}

// SAVE: одновременно в VK Storage + localStorage

// Полная синхронизация всех данных в VK Storage
function syncToVK() {
  if (!_vkAvailable || !_vkReady) return;
  var keys = ["wedding", "guests", "budget", "tasks", "vendors", "tables", "lang", "theme"];
  keys.forEach(function(key) {
    var data = load(key);
    if (data !== null && data !== undefined) {
      save(key, data);
    }
  });
}

// Экспорт всех данных
function exportAllData() {
  var data = {};
  var keys = ["wedding", "guests", "budget", "tasks", "vendors", "tables"];
  keys.forEach(function(k) {
    var d = load(k);
    if (d) data[k] = d;
  });
  return JSON.stringify(data, null, 2);
}

function _autoRestoreServer(cb) {
  // СЕРВЕР = ИСТОЧНИК ПРАВДЫ. Автоматически создаём/восстанавливаем личное пространство.
  function done() { render(); if (cb) cb(); }
  // Восстанавливаем из localStorage если есть
  if (!_syncCode) { try { _syncCode = JSON.parse(localStorage.getItem("colibri_couple_code")); } catch(e) {} }
  if (!_syncUserId && _syncUserId !== 0) { try { _syncUserId = JSON.parse(localStorage.getItem("colibri_sync_user_id")); } catch(e) {} }
  if (_syncCode && _syncUserId !== null && _syncUserId !== undefined) {
    // Уже есть пара — подтягиваем данные
    _pullFromServer(function() { done(); });
    return;
  }
  // Получаем VK user_id и создаём/восстанавливаем пару
  _getVKUserId().then(function(uid) {
    if (uid === null || uid === undefined) return;
    _syncUserId = uid;
    return fetch(API_BASE + "/couple", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id: uid, name: "User", role: "bride", data: _getAllData()})
    });
  }).then(function(r) {
    if (!r) return null;
    return r.json();
  }).then(function(res) {
    if (res && res.code) {
      _syncCode = res.code;
      save("couple_code", _syncCode);
      save("sync_user_id", _syncUserId);
      // Если сервер вернул данные (восстановление) — загружаем
      if (res.status === "existing" && res.data) {
        _loadFromServer(res.data);
      }
      if (res.members) save("sync_members", res.members);
      _startSync();
      if (_pendingPush) { _pendingPush = false; _pushToServer(); }
      done();
    }
  }).catch(function(e) {
    console.log("Auto-restore error:", e);
    done();
  });
}

// АВТОРИЗАЦИЯ VK — БЛОКИРОВКА до входа
var _vkAuthed = false;

function _vkLogin() {
  var gate = document.getElementById("vk_auth_gate");
  if (!window.vkBridge) {
    // Браузер без VK — показываем кнопку VK Login через OAuth
    window.location.href = "https://oauth.vk.com/authorize?client_id=54816577&display=mobile&redirect_uri=" + encodeURIComponent(window.location.href.split("#")[0]) + "&scope=friends&response_type=token&v=5.199";
    return;
  }
  // VK Mini App — запрашиваем токен
  vkBridge.send("VKWebAppGetAuthToken", {app_id: 54816577, scope: "friends"}).then(function(res) {
    if (res && res.response && res.response.access_token) {
      window._vkToken = res.response.access_token;
      _vkAuthed = true;
      localStorage.setItem("colibri_vk_authed", "1");
      gate.style.display = "none";
      document.body.classList.remove("vk-locked");
    }
  }).catch(function(e) {
    console.log("VK Login error:", e);
  });
}

function _vkCheckAuth(cb) {
  // Проверяем: авторизован ли пользователь
  var saved = localStorage.getItem("colibri_vk_authed");
  if (saved === "1" && window._vkToken) {
    _vkAuthed = true;
    if (cb) cb(true);
    return;
  }
  if (!window.vkBridge) {
    // Браузер — проверяем токен из URL hash (#access_token=...)
    var hash = window.location.hash.substring(1);
    if (hash) {
      var hp = new URLSearchParams(hash);
      var at = hp.get("access_token");
      if (at) {
        window._vkToken = at;
        _vkAuthed = true;
        localStorage.setItem("colibri_vk_authed", "1");
        localStorage.setItem("colibri_vk_token", at);
        // Убираем hash из URL
        history.replaceState(null, "", window.location.pathname + window.location.search);
        if (cb) cb(true);
        return;
      }
    }
    // Проверяем сохранённый токен
    var savedToken = localStorage.getItem("colibri_vk_token");
    if (savedToken) {
      window._vkToken = savedToken;
      _vkAuthed = true;
      if (cb) cb(true);
      return;
    }
    if (cb) cb(false);
    return;
  }
  // VK Mini App — пробуем получить токен молча, с таймаутом
  var _authDone = false;
  function _authCb(ok) { if (_authDone) return; _authDone = true; if (cb) cb(ok); }
  setTimeout(function() { _authCb(true); }, 3000); // Timeout: пускаем без токена
  vkBridge.send("VKWebAppGetAuthToken", {app_id: 54816577, scope: "friends"}).then(function(res) {
    if (res && res.response && res.response.access_token) {
      window._vkToken = res.response.access_token;
      _vkAuthed = true;
      localStorage.setItem("colibri_vk_authed", "1");
    }
    _authCb(true);
  }).catch(function() { _authCb(true); });
}

_initStorage(function() {
  // ПРОВЕРКА АВТОРИЗАЦИИ VK — блокировка приложения
  _vkCheckAuth(function(isAuthed) {
  if (!isAuthed) {
    // Показываем экран авторизации
    document.getElementById("vk_auth_gate").style.display = "flex";
    document.body.classList.add("vk-locked");
    return;
  }
  // Авторизован — показываем приложение
  document.getElementById("vk_auth_gate").style.display = "none";
  document.body.classList.remove("vk-locked");
  // СНАЧАЛА пробуем прямую загрузку с сервера
  var _directUid = 0;
  try {
    var _vp = new URLSearchParams(window.location.search);
    var _vid = _vp.get("vk_user_id");
    if (_vid && _vid !== "0") _directUid = parseInt(_vid);
    else { var _tmp = localStorage.getItem("colibri_sync_user_id"); if (_tmp) _directUid = _tmp; }
  } catch(e) {}
  fetch(API_BASE + "/user-data/" + _directUid).then(function(r){ return r.json(); }).then(function(res) {
    if (res && res.ok && res.data) {
      _loadFromServer(res.data);
      console.log("Direct restore OK from server");
    }
    _startApp();
  }).catch(function(){ _startApp(); });

  function _startApp() {
  // АВТОВОССТАНОВЛЕНИЕ с сервера — ЖДЁМ завершения перед рендером!
  _autoRestoreServer(function() {
    var params = new URLSearchParams(window.location.search);
    var joinCode = params.get("join");
    if (joinCode && !_syncCode) { setTimeout(function() { _autoJoin(joinCode, params.get("role") || "guest"); }, 1000); }
    if(_syncCode)_startSync();
    render();
    console.log("Storage ready. VK:", _vkAvailable, "Data loaded:", Object.keys(_vks).length);
  });
  }
  });
});

function startCountdown(){
  if(typeof _countdownInterval!=="undefined"&&_countdownInterval)clearInterval(_countdownInterval);
  function update(){
    var w=getWedding();
    var el=document.getElementById("countdown");
    if(!el)return;
    if(!w.date){el.innerHTML="<div style='font-size:16px'>&#128197; \u0423\u043a\u0430\u0436\u0438\u0442\u0435 \u0434\u0430\u0442\u0443 \u0441\u0432\u0430\u0434\u044c\u0431\u044b</div>";return}
    var diff=new Date(w.date+"T00:00:00")-new Date();
    var dE=document.getElementById("tDays");
    if(!dE){
      el.innerHTML='<div style="display:flex;justify-content:center;align-items:flex-end;gap:10px"><div style="text-align:center"><div id="tDays" style="font-size:40px;font-weight:900;line-height:1;color:#B8334E">0</div><div style="font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:1px;color:#8B4557">\u0434\u043d\u0435\u0439</div></div><div style="font-size:28px;opacity:.4;padding-bottom:14px;color:#B8334E">:</div><div style="text-align:center"><div id="tHours" style="font-size:40px;font-weight:900;line-height:1;color:#B8334E">00</div><div style="font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:1px;color:#8B4557">\u0447\u0430\u0441\u043e\u0432</div></div><div style="font-size:28px;opacity:.4;padding-bottom:14px;color:#B8334E">:</div><div style="text-align:center"><div id="tMins" style="font-size:40px;font-weight:900;line-height:1;color:#B8334E">00</div><div style="font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:1px;color:#8B4557">\u043c\u0438\u043d\u0443\u0442</div></div><div style="font-size:28px;opacity:.4;padding-bottom:14px;color:#B8334E">:</div><div style="text-align:center"><div id="tSecs" style="font-size:40px;font-weight:900;line-height:1;color:#B8334E">00</div><div style="font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:1px;color:#8B4557">\u0441\u0435\u043a\u0443\u043d\u0434</div></div></div>';
      dE=document.getElementById("tDays");
    }
    if(!dE)return;
    if(diff<=0){
      dE.textContent="0";
      document.getElementById("tHours").textContent="00";
      document.getElementById("tMins").textContent="00";
      document.getElementById("tSecs").textContent="00";
      return;
    }
    var d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);
    dE.textContent=d;
    document.getElementById("tHours").textContent=String(h).padStart(2,"0");
    document.getElementById("tMins").textContent=String(m).padStart(2,"0");
    document.getElementById("tSecs").textContent=String(s).padStart(2,"0");
  }
  update();_countdownInterval=setInterval(update,1000);
}

function saveGuestEdit(i){
  var guests=load("guests")||[];
  var g=guests[i];
  if(!g)return;
  
  g.comment=document.getElementById("edit_comment_"+i)?document.getElementById("edit_comment_"+i).value:g.comment;
  g.meal=document.getElementById("edit_meal_"+i)?document.getElementById("edit_meal_"+i).value:g.meal;
  
  var tableSelect=document.getElementById("edit_table_"+i);
  if(tableSelect){
    var ti=parseInt(tableSelect.value);
    var seating=load("seating")||{};
    var tables=load("tables")||[];
    if(ti>=0&&ti<tables.length){
      seating[g.name]=ti;
      g.table=tables[ti].name;
    }else{
      delete seating[g.name];
      g.table="";
    }
    save("seating",seating);
  }
  
  g._editing=false;
  save("guests",guests);
  render();
}

}

function importFromVK(){
  function showVKFeedback(msg,isError){
    var btns=document.querySelectorAll("button");
    for(var i=0;i<btns.length;i++){
      if(btns[i].textContent.includes("Из VK")){
        var old=btns[i].innerHTML;
        btns[i].innerHTML=msg;
        btns[i].style.background=isError?"#e74c3c":"#27ae60";
        btns[i].style.color="#fff";
        setTimeout(function(){btns[i].innerHTML=old;btns[i].style.background="";btns[i].style.color="";},2500);
        break;
      }
    }
  }
  
  if(!window.vkBridge){showVKFeedback("&#9888; Нет VK Bridge",true);return}
  
  showVKFeedback("&#8987; Загрузка...",false);
  
  // Авторизация VK + получение друзей через API
  vkBridge.send("VKWebAppGetAuthToken",{app_id:54816577,scope:"friends"}).then(function(authData){
    var token=(authData&&authData.response&&authData.response.access_token)||"";
    if(!token){showVKFeedback("&#9888; Нет токена VK",true);return}
    // Получаем друзей через VK API
    return fetch("https://api.vk.com/method/friends.get?access_token="+token+"&v=5.199&fields=first_name,last_name&count=500")
      .then(function(r){return r.json()});
  }).then(function(data){
    var friends=(data&&data.response&&data.response.items)||[];
    if(friends.length===0){showVKFeedback("&#9888; Друзья не найдены",true);return}
    var guests=load("guests")||[];
    var existing=guests.map(function(g){return g.name});
    var added=0;
    friends.forEach(function(f){
      var name=(f.first_name||"")+" "+(f.last_name||"");
      if(name.trim()&&existing.indexOf(name)===-1){
        guests.push({name:name.trim(),status:"ожидает",vk_id:f.id});
        added++;
      }
    });
    save("guests",guests);
    showVKFeedback("&#10003; "+added+" друзей!",false);
    render();
  }).catch(function(e){
    console.log("VK Friends error:",e);
    showVKFeedback("&#9888; Ошибка VK",true);
  });
}

function getBudgetSummary(){
  var w=getWedding();
  var totalBudget=parseFloat(w.budget||0);
  var budgetItems=load("budget")||[];
  var vendorItems=load("vendors")||[];
  var budgetPaid=budgetItems.reduce(function(s,i){return s+(i.paid?parseFloat(i.sum||0):0)},0);
  var budgetTotal=budgetItems.reduce(function(s,i){return s+parseFloat(i.sum||0)},0);
  var vendorPaid=vendorItems.reduce(function(s,v){return s+parseFloat(v.paid||0)},0);
  var vendorTotal=vendorItems.reduce(function(s,v){return s+parseFloat(v.cost||0)},0);
  var totalPaid=budgetPaid+vendorPaid;
  var totalAll=budgetTotal+vendorTotal;
  var totalLeft=totalAll-totalPaid;
  var budgetLeft=totalBudget-totalPaid;
  return {totalBudget:totalBudget,totalAll:totalAll,totalPaid:totalPaid,totalLeft:totalLeft,budgetLeft:budgetLeft,budgetPaid:budgetPaid,budgetTotal:budgetTotal,vendorPaid:vendorPaid,vendorTotal:vendorTotal};
}

        h+="<div onclick='showGuestPicker("+ti+","+i+")' style='width:44px;height:44px;border-radius:50%;border:2px dashed #3a4d32;display:flex;align-items:center;justify-content:center;font-size:16px;color:#ccc;cursor:pointer;transition:all .2s'>+</div>";
      }
    }
    h+="</div>";
    
    // Кнопка назначения
    h+="<select onchange='assignGuest(this.value,"+ti+")' style='width:100%;margin-top:10px;padding:10px;border:2px solid var(--border);border-radius:12px;font-size:14px;background:var(--card2);color:var(--text)'>";
    h+="<option value=''>+ Назначить гостя</option>";
    guests.forEach(function(g){
      if(seating[g.name]===undefined){
        h+="<option value='"+g.name+"'>"+g.name+"</option>";
      }
    });
    h+="</select>";
    
    if(_guestPickerTable===ti){
      var unassignedGuests=guests.filter(function(g){return seating[g.name]===undefined});
      if(unassignedGuests.length>0){
        h+="<div style='background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-top:8px'>";
        h+="<div style='font-size:12px;color:var(--text2);margin-bottom:6px'>Выберите гостя:</div>";
        unassignedGuests.forEach(function(g){
          h+="<div onclick='assignGuestFromPicker(\""+g.name+"\","+ti+")' style='padding:8px 12px;margin:4px 0;background:var(--card);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s;font-size:13px;color:var(--text)'>"+g.name+"</div>";
        });
        h+="<button onclick='hideGuestPicker()' style='width:100%;padding:6px;margin-top:6px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer'>✕ Закрыть</button>";
        h+="</div>";
      }
    }
    h+="</div>";
  });
  
  // Кнопка добавления стола
  if(_showAddTable){
    h+="<div style='background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:12px'>";
    h+="<div style='font-size:12px;color:var(--text2);margin-bottom:4px'>Название</div>";
    h+="<input id='new_table_name' placeholder='Название стола' style='width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;margin-bottom:8px'>";
    h+="<div style='font-size:12px;color:var(--text2);margin-bottom:4px'>Мест</div>";
    h+="<input id='new_table_seats' type='number' value='8' min='1' style='width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;margin-bottom:8px'>";
    h+="<div style='display:flex;gap:8px'>";
    h+="<button onclick='addTable()' style='flex:1;padding:10px;background:var(--accent);color:var(--accent-text);border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer'>➕ Добавить</button>";
    h+="<button onclick='toggleAddTable()' style='flex:1;padding:10px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer'>✕ Отмена</button>";
    h+="</div></div>";
  }else{
    h+="<button onclick='toggleAddTable()' style='background:rgba(0,229,255,0.1);color:#00E5FF;box-shadow:none;border:2px dashed #e8739a'>&#10133; Добавить стол</button>";
  }
  
  // Неназначенные гости
  var unassigned=guests.filter(function(g){return seating[g.name]===undefined});
  if(unassigned.length>0){
    h+="<div style='margin-top:16px'><h3>&#128101; Без места ("+unassigned.length+")</h3>";
    unassigned.forEach(function(g){
      h+="<div class='list-item' style='display:flex;align-items:center;gap:8px'>";
      h+="<div style='width:32px;height:32px;border-radius:50%;background:#3a4d32;display:flex;align-items:center;justify-content:center;font-size:14px;color:#00E5FF'>&#128100;</div>";
      h+="<div style='flex:1;font-size:13px'>"+g.name+"</div>";
      h+="</div>";
    });
    h+="</div>";
  }
  
  h+="</div>";
  c.innerHTML=h;
}

var _guestPickerTable=-1;
function showGuestPicker(tableIdx,seatIdx){
  _guestPickerTable=tableIdx;
  render();
}

function hideGuestPicker(){
  _guestPickerTable=-1;
  render();
}

function assignGuestFromPicker(name,tableIdx){
  if(!name)return;
  assignGuest(name,tableIdx);
  _guestPickerTable=-1;
  render();
}

function assignGuest(name,tableIdx){
  if(!name)return;
  var seating=load("seating")||{};
  seating[name]=tableIdx;
  save("seating",seating);
  
  // Update guest card
  var tables=load("tables")||[];
  var tableName=tables[tableIdx]?tables[tableIdx].name:("Стол "+(tableIdx+1));
  var guests=load("guests")||[];
  guests.forEach(function(g){
    if(g.name===name){
      g.table=tableName;
    }
  });
  save("guests",guests);
  render();
}

function unassignGuest(name){
  var seating=load("seating")||{};
  delete seating[name];
  save("seating",seating);
  
  // Clear guest card
  var guests=load("guests")||[];
  guests.forEach(function(g){
    if(g.name===name){
      g.table="";
    }
  });
  save("guests",guests);
  render();
}

function editTable(i){
  var tables=load("tables")||[];
  if(tables[i]){
    tables[i]._editing=true;
    save("tables",tables);
    render();
  }
}

function saveTableEdit(i){
  var tables=load("tables")||[];
  if(!tables[i])return;
  var nameEl=document.getElementById("edit_table_name_"+i);
  var seatsEl=document.getElementById("edit_table_seats_"+i);
  if(nameEl)tables[i].name=nameEl.value||tables[i].name;
  if(seatsEl)tables[i].seats=parseInt(seatsEl.value)||tables[i].seats;
  tables[i]._editing=false;
  save("tables",tables);
  render();
}

function cancelTableEdit(i){
  var tables=load("tables")||[];
  if(tables[i]){
    tables[i]._editing=false;
    save("tables",tables);
    render();
  }
}

var _showAddTable=false;
function toggleAddTable(){
  _showAddTable=!_showAddTable;
  render();
}

function addTable(){
  var nameEl=document.getElementById("new_table_name");
  var seatsEl=document.getElementById("new_table_seats");
  var name=nameEl?nameEl.value.trim():"";
  var seats=seatsEl?parseInt(seatsEl.value)||8:8;
  if(!name)return;
  var tables=load("tables")||[];
  tables.push({name:name,seats:seats});
  save("tables",tables);
  _showAddTable=false;
  render();
}

var _confirmDeleteTable=-1;
function askDeleteTable(idx){
  _confirmDeleteTable=idx;
  render();
}

function removeTable(idx){
  var tables=load("tables")||[];
  tables.splice(idx,1);
  save("tables",tables);
  
  // Обновляем seating
  var seating=load("seating")||{};
  Object.keys(seating).forEach(function(g){
    if(seating[g]===idx)delete seating[g];
    else if(seating[g]>idx)seating[g]--;
  });
  save("seating",seating);
  _confirmDeleteTable=-1;
  render();
}

function cancelDeleteTable(){
  _confirmDeleteTable=-1;
  render();
}

function toggleTaskExpand(i){
  var tasks=load("tasks")||[];
  if(tasks[i]){tasks[i]._expanded=!tasks[i]._expanded;save("tasks",tasks);render();}
}

function addTask(){
  var name=document.getElementById("task_name").value;
  if(!name)return;
  var priority=document.getElementById("task_priority")?document.getElementById("task_priority").value:"normal";
  var deadline=document.getElementById("task_deadline")?document.getElementById("task_deadline").value:"";
  var tasks=load("tasks")||[];
  tasks.push({name:name,priority:priority,deadline:deadline,done:false});
  save("tasks",tasks);
  render();
}

function toggleTask(i){
  var tasks=load("tasks")||[];
  if(tasks[i]){tasks[i].done=!tasks[i].done;save("tasks",tasks);render();}
}

var _confirmDelT=-1;
function deleteTask(i){
  if(_confirmDelT===i){
    var tasks=load("tasks")||[];
    tasks.splice(i,1);
    save("tasks",tasks);
    _confirmDelT=-1;
  }else{
    _confirmDelT=i;
  }
  render();
}

function editTask(i){
  var tasks=load("tasks")||[];
  if(!tasks[i])return;
  tasks[i]._editing=!tasks[i]._editing;
  save("tasks",tasks);
  render();
}
function saveTaskEdit(i){
  var tasks=load("tasks")||[];
  if(!tasks[i])return;
  var el=document.getElementById("task_edit_"+i);
  if(el&&el.value.trim()){tasks[i].name=el.value.trim();}
  tasks[i]._editing=false;
  save("tasks",tasks);
  render();
}

function renderTasks(c){
  var tasks=load("tasks")||[];
  var done=tasks.filter(function(t){return t.done}).length;
  
  var h="<div class='card'><h3>&#9989; Задачи ("+done+"/"+tasks.length+")</h3>";
  
  var pct=tasks.length>0?Math.round(done/tasks.length*100):0;
  h+="<div style='background:var(--border);border-radius:10px;height:10px;margin:8px 0 12px'>";
  h+="<div style='background:"+(pct>=100?"#27ae60":"#E1306C")+";width:"+pct+"%;height:100%;border-radius:8px;transition:width .3s'></div>";
  h+="</div>";
  
  var sorted=tasks.slice().sort(function(a,b){
    if(a.done!==b.done)return a.done?1:-1;
    var pri={low:0,normal:1,high:2};
    var pa=pri[a.priority||"normal"]||1;
    var pb=pri[b.priority||"normal"]||1;
    return pa-pb;
  });
  
  sorted.forEach(function(t){
    var realIdx=tasks.indexOf(t);
    var priColors={high:"#e74c3c",normal:"#f39c12",low:"#3498db"};
    var priLabels={high:"Высокий",normal:"Средний",low:"Низкий"};
    var priColor=priColors[t.priority||"normal"]||"#f39c12";
    var priLabel=priLabels[t.priority||"normal"]||"Средний";
    
    var overdue=false;
    if(t.deadline&&!t.done)overdue=new Date(t.deadline)<new Date();
    
    h+="<div style='border-bottom:1px solid var(--border);padding:10px 0'>";
    h+="<div onclick='toggleTaskExpand("+realIdx+")' style='display:flex;align-items:center;gap:10px;cursor:pointer'>";
    h+="<input type='checkbox' style='width:auto;margin:0' "+(t.done?"checked":"")+" onclick='event.stopPropagation();toggleTask("+realIdx+")'>";
    h+="<div style='flex:1'>";
    h+="<div style='font-weight:500"+(t.done?";text-decoration:line-through;color:var(--text2)":";color:var(--text)")+"'>"+t.name+"</div>";
    h+="<div style='display:flex;gap:8px;margin-top:3px'>";
    h+="<span style='font-size:10px;padding:2px 6px;border-radius:4px;background:"+priColor+";color:#fff'>"+priLabel+"</span>";
    if(t.deadline){
      h+="<span style='font-size:10px;color:"+(overdue?"#e74c3c":"var(--text2)")+"'>Дедлайн: "+t.deadline+"</span>";
    }
    h+="</div></div>";
    h+="<span style='font-size:12px;color:var(--text2)'>"+(t._expanded?"&#9650;":"&#9660;")+"</span>";
    h+="</div>";
    
    if(t._expanded){
      h+="<div style='padding:10px 0 4px 30px'>";
      if(t.deadline)h+="<div style='font-size:12px;color:var(--text);margin-bottom:4px'>Дедлайн: "+t.deadline+(overdue?" <span style='color:#e74c3c;font-weight:700'>(просрочено)</span>":"")+"</div>";
      h+="<div style='display:flex;gap:8px;margin-top:8px'>";
      h+="<button onclick='toggleTask("+realIdx+")' style='flex:1;padding:6px;font-size:12px;border-radius:8px;background:"+(t.done?"var(--card2)":"#27ae60")+";color:"+(t.done?"var(--text2)":"#fff")+";border:"+(t.done?"1px solid var(--border)":"none")+";cursor:pointer'>"+(t.done?"&#8634; Отменить":"&#9989; Выполнено")+"</button>";
      if(t._editing){
        h+="<input id='task_edit_"+realIdx+"' value='"+t.name.replace(/'/g,"&#39;")+"' style='width:100%;padding:8px;border:1px solid var(--accent);border-radius:8px;background:var(--card2);color:var(--text);font-size:13px;margin-bottom:8px'>";
        h+="<button onclick='saveTaskEdit("+realIdx+")' style='flex:1;padding:6px;font-size:12px;border-radius:8px;background:var(--accent);color:var(--accent-text);border:none;cursor:pointer'>&#128190; Сохранить</button>";
      }else{
        h+="<button onclick='editTask("+realIdx+")' style='flex:1;padding:6px;font-size:12px;border-radius:8px;background:var(--card2);color:var(--text);border:1px solid var(--border);cursor:pointer'>&#9998; Редактировать</button>";
      }
      if(_confirmDelT===realIdx){
        h+="<span style='flex:1;font-size:11px;color:#e74c3c;padding:6px'>Удалить?</span>";
        h+="<button onclick='deleteTask("+realIdx+")' style='padding:6px 10px;font-size:12px;border-radius:8px;background:#e74c3c;color:#fff;border:none;cursor:pointer'>Да</button>";
        h+="<button onclick='_confirmDelT=-1;render()' style='padding:6px 10px;font-size:12px;border-radius:8px;background:var(--card2);color:var(--text);border:1px solid var(--border);cursor:pointer'>Нет</button>";
      }else{
        h+="<button onclick='deleteTask("+realIdx+")' style='flex:1;padding:6px;font-size:12px;border-radius:8px;background:#e74c3c;color:#fff;border:none;cursor:pointer'>&#10060; Удалить</button>";
      }
      h+="</div></div>";
    }
    h+="</div>";
  });
  
  if(tasks.length===0){
    h+="<div style='text-align:center;padding:20px;color:var(--text2)'>&#128203; Нет задач</div>";
  }
  
  h+="<div style='margin-top:16px'>";
  h+="<input id='task_name' placeholder='Новая задача'>";
  h+="<input id='task_deadline' type='date' style='margin-top:8px'>";
  h+="<select id='task_priority' style='width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-top:8px;background:var(--card2);color:var(--text)'>";
  h+="<option value='high'>Высокий</option>";
  h+="<option value='normal' selected>Средний</option>";
  h+="<option value='low'>Низкий</option>";
  h+="</select>";
  h+="<button onclick='addTask()'>&#10133; Добавить</button>";
  h+="</div></div>";
  
  c.innerHTML=showNotifications()+h;
}

function checkNotifications(){
  var tasks=load("tasks")||[];
  var vendors=load("vendors")||[];
  var w=getWedding();
  var notifs=[];
  
  tasks.forEach(function(t){
    if(!t.done&&t.deadline){
      var days=Math.ceil((new Date(t.deadline)-new Date())/86400000);
      if(days<=0)notifs.push("&#9888; Просрочено: "+t.name);
      else if(days<=3)notifs.push("&#128197; Через "+days+" дн: "+t.name);
    }
  });
  
  vendors.forEach(function(v){
    var remain=parseFloat(v.cost||0)-parseFloat(v.paid||0);
    if(remain>0&&parseFloat(v.paid||0)===0)notifs.push("&#128176; Оплатить: "+v.name+" ("+remain.toLocaleString()+" ₽)");
  });
  
  if(w.date){
    var days=Math.ceil((new Date(w.date)-new Date())/86400000);
    if(days>0&&days<=7)notifs.push("&#128146; До свадьбы "+days+" дн!");
  }
  
  return notifs;
}

function showNotifications(){
  var notifs=checkNotifications();
  if(notifs.length===0)return "";
  var h="<div style='background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.2);border-radius:14px;position:relative;overflow:hidden;border-left:4px solid #00E5FF;padding:12px;margin-bottom:12px'>";
  h+="<div style='font-weight:600;margin-bottom:6px'>&#128276; Уведомления</div>";
  notifs.forEach(function(n){
    h+="<div style='font-size:12px;margin-bottom:4px'>"+n+"</div>";
  });
  h+="</div>";
  return h;
}

function renderSettings(c){
  var w=getWedding();
  var guests=load("guests")||[];
  var budget=load("budget")||[];
  var tasks=load("tasks")||[];
  var checklist=load("checklist")||[];
  var vendors=load("vendors")||[];
  
  var h=showNotifications();
  
  h+="<div class='card'><h3>&#9881; Настройки</h3>";
  
  h+="<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px'>";
  h+="<div style='background:linear-gradient(135deg,#2d3b28,#243020);padding:14px 10px;border-radius:14px;text-align:center;border:1px solid rgba(0,0,0,0.04)'><div style='font-size:18px;font-weight:700;color:#E1306C'>"+guests.length+"</div><div style='font-size:10px;color:#999'>гостей</div></div>";
  h+="<div style='background:linear-gradient(135deg,#2d3b28,#243020);padding:14px 10px;border-radius:14px;text-align:center;border:1px solid rgba(0,0,0,0.04)'><div style='font-size:18px;font-weight:700;color:#27ae60'>"+budget.length+"</div><div style='font-size:10px;color:#999'>расходов</div></div>";
  h+="<div style='background:linear-gradient(135deg,#2d3b28,#243020);padding:14px 10px;border-radius:14px;text-align:center;border:1px solid rgba(0,0,0,0.04)'><div style='font-size:18px;font-weight:700;color:#f39c12'>"+vendors.length+"</div><div style='font-size:10px;color:#999'>поставщиков</div></div>";
  h+="</div>";
  
  h+="<div style='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px'>";
  h+="<div style='background:linear-gradient(135deg,#2d3b28,#243020);padding:14px 10px;border-radius:14px;text-align:center;border:1px solid rgba(0,0,0,0.04)'><div style='font-size:18px;font-weight:700;color:#3498db'>"+tasks.filter(function(t){return !t.done}).length+"</div><div style='font-size:10px;color:#999'>задач</div></div>";
  h+="<div style='background:linear-gradient(135deg,#2d3b28,#243020);padding:14px 10px;border-radius:14px;text-align:center;border:1px solid rgba(0,0,0,0.04)'><div style='font-size:18px;font-weight:700;color:#9b59b6'>"+checklist.filter(function(i){return i.done}).length+"/"+checklist.length+"</div><div style='font-size:10px;color:#999'>чек</div></div>";
  h+="</div>";
  
  h+="<button onclick='exportData()' style='margin-bottom:8px'>&#128229; Экспорт</button>";
  h+="<button onclick='importData()' style='margin-bottom:8px;background:#3498db'>&#128228; Импорт</button>";
  h+="<input type='file' id='import_file' accept='.json' style='display:none' onchange='handleImport(event)'>";
  h+="<button onclick='resetData()' style='background:#e74c3c'>&#128465; Сброс</button>";
  h+="</div>";
  
  h+=renderPartnerSection();
  h+="<div class='card'><h3>&#128241; Ярлык</h3>";
  h+="<p style='font-size:13px;color:#666'>Меню → «Добавить на экран»</p></div>";
  
  h+="<div class='card'><p style='font-size:12px;color:#999;text-align:center'>Colibri v3.0</p></div>";
  
  c.innerHTML=h;
}

function exportData(){
  var data={wedding:load("wedding"),guests:load("guests"),budget:load("budget"),tasks:load("tasks"),checklist:load("checklist")};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="colibri-backup.json";
  a.click();
}

function importData(){
  document.getElementById("import_file").click();
}

function handleImport(e){
  var file=e.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      if(data.wedding)save("wedding",data.wedding);
      if(data.guests)save("guests",data.guests);
      if(data.budget)save("budget",data.budget);
      if(data.tasks)save("tasks",data.tasks);
      if(data.checklist)save("checklist",data.checklist);
      console.log("Imported!");
      render();
    }catch(err){
      console.log("Import error");
    }
  };
  reader.readAsText(file);
}

function resetData(){
  if(confirm("Удалить все данные? Это действие нельзя отменить.")){
    localStorage.clear(); _vkStorage = {}; if(window.vkBridge){vkBridge.send("VKWebAppStorageGetKeys",{count:100}).then(function(r){(r.keys||[]).forEach(function(k){vkBridge.send("VKWebAppStorageSet",{key:k,value:""})})})}
    render();
  }
}

// Initialize default tables if not set
if(load("tables")===null){
  save("tables",[{name:"Стол 1",seats:8},{name:"Стол 2",seats:8}]);
}

render();startCountdown();
